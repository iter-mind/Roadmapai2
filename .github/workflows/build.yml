      - name: Build Debug APK
        run: |
          cd SkilioApp
          # This line downloads the missing wrapper jar file before building
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew assembleDebug
          
